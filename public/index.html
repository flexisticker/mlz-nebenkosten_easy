<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vermieter-Portal</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Vermieter-Portal</h1>
  <nav id="tabs">
    <button data-tab="uebersicht">Übersicht</button>
    <button data-tab="stammdaten">Stammdaten</button>
    <button data-tab="nebenkosten">Nebenkosten</button>
    <button data-tab="dokumente">Dokumente</button>
    <button data-tab="vertrag">Mietvertrag</button>
    <button data-tab="schreiben">Mieterhöhung &amp; Briefe</button>
    <button data-tab="sicherung">Datensicherung</button>
  </nav>
  <span id="speicherStatus"></span>
</header>
<main id="inhalt"></main>
<div id="print"></div>
<input type="file" id="jsonDatei" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
